<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Práctica CI/CD</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
    <h1>Iniciar sesión</h1>
    <form id="loginForm" novalidate aria-label="Formulario de login">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email"
               autocomplete="email" required
               aria-required="true" aria-describedby="emailError">
        <span id="emailError" class="error" role="alert"></span>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required minlength="8"
               aria-required="true" aria-describedby="pwdError">
        <span id="pwdError" class="error" role="alert"></span>
      </div>
      <button type="submit">Entrar</button>
      <p id="formMsg" class="msg" aria-live="polite"></p>
    </form>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
