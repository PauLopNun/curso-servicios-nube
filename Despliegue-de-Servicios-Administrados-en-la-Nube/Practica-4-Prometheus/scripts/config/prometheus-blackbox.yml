global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: 'node_exporter'
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
        filters:
          - name: tag:Monitorizar
            values: ['prometheus']
    # Etiquetas extra a partir de los metadatos de EC2, para reconocer cada nodo
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: nombre
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id

  # Otros exporters: Blackbox Exporter comprueba URLs desde fuera (sondas HTTP)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://aws.amazon.com
          - https://prometheus.io
          - http://172.31.0.250        # no existe: la sonda debe fallar
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target   # la URL se pasa como ?target=...
      - source_labels: [__param_target]
        target_label: instance         # y se usa como nombre de la instancia
      - target_label: __address__
        replacement: localhost:9115    # a quien se pregunta es al Blackbox Exporter
